name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Test core package
        run: swift test --package-path Packages/NetToolCore

      - name: Resolve package version
        id: package
        run: echo "version=$(bash scripts/package_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build unsigned IPA
        run: bash scripts/build_unsigned_ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: NetTool-${{ steps.package.outputs.version }}
          path: build/NetTool-${{ steps.package.outputs.version }}.ipa
          if-no-files-found: error
          retention-days: 14
          archive: false
